[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-agent"
version = "0.1.0"
description = "Autonomous pentest agent for bug bounty programs"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "banepsec" }]
dependencies = [
    "questionary>=2.0.1",
    "rich>=13.7.0",
    "typer>=0.12.3",
    "google-generativeai>=0.7.2",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "pydantic>=2.7.0",
    "structlog>=24.2.0",
    "pyyaml>=6.0.1",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
]

[project.scripts]
recon-agent = "recon_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["recon_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
